name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    app:
        name: App (lint, types, tests, build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Lint
              run: npm run lint

            - name: Types
              run: npm run typecheck

            - name: Tests
              run: npm test

            # The Groq and Upstash clients are created on first use,
            # so the build needs no API keys.
            - name: Build
              run: npm run build
              env:
                  NEXT_TELEMETRY_DISABLED: 1
